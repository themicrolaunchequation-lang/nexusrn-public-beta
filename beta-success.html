<script id="nexus-verified-purchase-gate">
(function () {
  "use strict";

  const endpoint =
    "https://yzlrekjjvenxzpenyily.supabase.co/functions/v1/verify-stripe-purchase";

  const gate =
    document.getElementById("nexusPurchaseVerification");

  const content =
    document.getElementById("nexusVerifiedPurchaseContent");

  const title =
    document.getElementById(
      "nexusPurchaseVerificationTitle"
    );

  const message =
    document.getElementById(
      "nexusPurchaseVerificationMessage"
    );

  const retryButton =
    document.getElementById(
      "nexusRetryPurchaseVerification"
    );

  const sessionPattern =
    /^cs_(?:live|test)_[A-Za-z0-9]+$/;

  const transactionPattern =
    /^[a-f0-9]{64}$/;

  function showFailure(failureMessage, allowRetry) {
    gate.dataset.state = "failed";
    gate.setAttribute("aria-busy", "false");

    title.textContent =
      "We could not verify your payment";

    message.textContent = failureMessage;

    retryButton.hidden = !allowRetry;

    content.hidden = true;
    content.setAttribute("aria-hidden", "true");
  }

  function revealVerifiedContent(result) {
    window.NEXUS_VERIFIED_PURCHASE = Object.freeze({
      verified: true,
      transaction_id: result.transaction_id,
      value: 112.50,
      currency: "SAR"
    });

    const cleanUrl = new URL(window.location.href);
    cleanUrl.searchParams.delete("session_id");

    const remainingQuery =
      cleanUrl.searchParams.toString();

    window.history.replaceState(
      null,
      document.title,
      cleanUrl.pathname +
        (remainingQuery ? "?" + remainingQuery : "") +
        cleanUrl.hash
    );

    gate.hidden = true;
    gate.setAttribute("aria-hidden", "true");
    gate.setAttribute("aria-busy", "false");

    content.hidden = false;
    content.removeAttribute("aria-hidden");
  }

  async function verifyPurchase() {
    const parameters =
      new URLSearchParams(window.location.search);

    const sessionId =
      (parameters.get("session_id") || "").trim();

    if (!sessionPattern.test(sessionId)) {
      showFailure(
        "No valid Stripe payment reference was provided. " +
        "Please return to the official NexusRN payment page.",
        false
      );

      return;
    }

    gate.dataset.state = "verifying";
    gate.setAttribute("aria-busy", "true");

    title.textContent = "Verifying your payment";

    message.textContent =
      "Please wait while NexusRN securely confirms " +
      "your Stripe payment.";

    retryButton.hidden = true;

    const controller = new AbortController();

    const timeoutId = window.setTimeout(
      function () {
        controller.abort();
      },
      15000
    );

    try {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          session_id: sessionId
        }),
        cache: "no-store",
        credentials: "omit",
        referrerPolicy: "no-referrer",
        signal: controller.signal
      });

      const result = await response
        .json()
        .catch(function () {
          return null;
        });

      const validResult =
        response.ok &&
        result &&
        result.verified === true &&
        transactionPattern.test(
          String(result.transaction_id || "")
        ) &&
        Number(result.value) === 112.50 &&
        result.currency === "SAR";

      if (!validResult) {
        showFailure(
          "Stripe has not confirmed this payment. " +
          "If you were charged, please retry verification " +
          "or contact NexusRN support.",
          true
        );

        return;
      }

      revealVerifiedContent(result);
    } catch (error) {
      const timedOut =
        error instanceof DOMException &&
        error.name === "AbortError";

      showFailure(
        timedOut
          ? "Payment verification timed out. " +
            "Please retry."
          : "Payment verification is temporarily unavailable. " +
            "Please retry in a moment.",
        true
      );
    } finally {
      window.clearTimeout(timeoutId);
    }
  }

  retryButton.addEventListener(
    "click",
    verifyPurchase
  );

  verifyPurchase();
})();
</script>
