<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Auth Callback | NexusRN</title><meta name="theme-color" content="#020617"/>
<style id="nexus-auth-css">
  :root{--bg:#020617;--panel:#0b1329;--panel2:#0f172a;--text:#f8fafc;--muted:#94a3b8;--line:rgba(148,163,184,.22);--teal:#14b8a6;--cyan:#22d3ee;--amber:#fbbf24;--danger:#fb7185;--green:#34d399;}
  *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 20% 0%,rgba(20,184,166,.16),transparent 28%),linear-gradient(135deg,#020617,#081226 55%,#020617);color:var(--text);font-family:'Plus Jakarta Sans',Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;} a{color:inherit}.nx-shell{max-width:1120px;margin:0 auto;padding:28px 18px 52px}.nx-top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:34px}.nx-brand{font-weight:950;font-size:22px;letter-spacing:-.04em}.nx-brand span{color:var(--teal)}.nx-sub{font-size:11px;text-transform:uppercase;letter-spacing:.22em;color:var(--muted);font-weight:800}.nx-nav{display:flex;gap:10px;flex-wrap:wrap}.nx-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:rgba(15,23,42,.72);color:var(--text);text-decoration:none;border-radius:999px;padding:11px 15px;font-weight:900;font-size:13px;cursor:pointer}.nx-btn.primary{background:linear-gradient(135deg,var(--teal),var(--cyan));color:#020617;border-color:transparent;box-shadow:0 14px 30px rgba(20,184,166,.22)}.nx-btn.warn{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.35);color:#fde68a}.nx-btn.danger{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.35);color:#fecdd3}.nx-btn[disabled],.nx-btn.disabled{opacity:.55;cursor:not-allowed}.nx-hero{display:grid;grid-template-columns:1.04fr .96fr;gap:26px;align-items:start}.nx-card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(15,23,42,.92),rgba(2,6,23,.88));border-radius:28px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.04)}.nx-kicker{display:inline-flex;border:1px solid rgba(20,184,166,.36);background:rgba(20,184,166,.1);color:#67e8f9;border-radius:999px;padding:7px 10px;text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:950}.nx-title{font-size:clamp(32px,5vw,60px);line-height:.98;margin:18px 0 14px;letter-spacing:-.06em}.nx-lead{color:#cbd5e1;font-size:17px;line-height:1.75}.nx-list{display:grid;gap:12px;margin:22px 0}.nx-list div{display:flex;gap:10px;align-items:flex-start;color:#dbeafe;font-size:14px;line-height:1.45}.nx-check{color:#2dd4bf;font-weight:950}.nx-form{display:grid;gap:14px;margin-top:18px}.nx-field label{display:block;font-size:12px;color:#cbd5e1;font-weight:900;margin:0 0 7px}.nx-input{width:100%;border:1px solid rgba(148,163,184,.28);background:rgba(2,6,23,.62);color:#fff;border-radius:15px;padding:14px 15px;font-size:15px;outline:none}.nx-input:focus{border-color:rgba(34,211,238,.75);box-shadow:0 0 0 3px rgba(34,211,238,.12)}.nx-status{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035);padding:14px;color:#cbd5e1;font-size:13px;line-height:1.55;white-space:pre-wrap}.nx-status.good{border-color:rgba(52,211,153,.34);background:rgba(52,211,153,.08);color:#d1fae5}.nx-status.bad{border-color:rgba(251,113,133,.34);background:rgba(251,113,133,.08);color:#fecdd3}.nx-note{font-size:12px;color:#94a3b8;line-height:1.55;margin-top:12px}.nx-price{font-size:64px;font-weight:950;letter-spacing:-.07em;line-height:1;margin:18px 0 2px}.nx-price small{font-size:20px;color:var(--muted);letter-spacing:0;font-weight:850}.nx-footer{border-top:1px solid var(--line);margin-top:38px;padding-top:20px;color:#64748b;font-size:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}.nx-footer a{color:#67e8f9;text-decoration:none}.nx-pill{display:inline-flex;border:1px solid rgba(148,163,184,.24);padding:7px 10px;border-radius:999px;background:rgba(15,23,42,.55);font-size:12px;font-weight:900;color:#cbd5e1}@media(max-width:860px){.nx-hero{grid-template-columns:1fr}.nx-top{align-items:flex-start;flex-direction:column}.nx-price{font-size:52px}}
</style>

</head>
<body>
<main class="nx-shell">
  <header class="nx-top"><div><div class="nx-brand">Nexus<span>RN</span></div><div class="nx-sub">Auth Callback</div></div><nav class="nx-nav"><a class="nx-btn" href="index.html">Landing</a><a class="nx-btn" href="auth-sign-in.html">Sign In</a></nav></header>
  <section class="nx-card"><span class="nx-kicker">Processing</span><h1 class="nx-title">Finishing sign-in…</h1><p class="nx-lead">NexusRN is confirming your Supabase authentication session.</p><div class="nx-status" id="auth-status">Checking session…</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/nexusrn-supabase-auth.js"></script>
<script>
(async function(){
  var status=document.getElementById('auth-status');
  function setStatus(msg, cls){ status.textContent=msg; status.className='nx-status '+(cls||''); }
  try{
    var session=await NEXUSRN_SUPABASE.getSession();
    if(session && session.user){ setStatus('Signed in as '+session.user.email+'. Redirecting to Account…','good'); setTimeout(function(){ location.href='account.html'; },750); }
    else { setStatus('No active session found. Please sign in again.','bad'); setTimeout(function(){ location.href='auth-sign-in.html'; },1400); }
  }catch(e){ setStatus('Auth callback failed: '+NEXUSRN_SUPABASE.statusText(e),'bad'); }
})();
</script>
</body>
</html>
